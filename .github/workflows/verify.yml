# Vérification des parties classées (chap. 1, README « Mise en ligne ») : rejoue les parties en attente dans D1 et
# inscrit leur score. Toutes les heures, ou à la main depuis l'onglet Actions.
name: Vérification des parties classées

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Tout l'historique : chaque partie se rejoue avec les règles de son propre commit
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Le moteur n'a aucune dépendance : Node suffit, sans installation
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/verify.ts
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
